# API Java do AutoniCK. Por padrão só PostgreSQL local. Segredos só por variável de ambiente.
spring.application.name=autonick-os-api
server.port=${PORT:${PORTA:8081}}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.datasource.url=${AUTONICK_API_DB_URL:jdbc:postgresql://localhost:5432/autonick_local}
spring.datasource.username=${AUTONICK_API_DB_USUARIO:autonick_api}
spring.datasource.password=${AUTONICK_API_DB_SENHA:}
spring.datasource.hikari.pool-name=autonick-os-api

# Contrato do token do Neon Auth: JWKS e emissor exato; audiência opcional (o contrato atual não exige).
autonick.auth.jwks-uri=${AUTONICK_AUTH_JWKS_URI:}
autonick.auth.emissor=${AUTONICK_AUTH_EMISSOR:}
autonick.auth.audiencia=${AUTONICK_AUTH_AUDIENCIA:}

# Modo do token: neon (padrão; JWKS do Neon Auth) ou demo (contas fictícias; a API emite e valida os próprios tokens).
autonick.auth.modo=${AUTONICK_AUTH_MODO:neon}
autonick.auth.segredo-demo=${AUTONICK_DEMO_SEGREDO:}
autonick.auth.cookie-seguro=${AUTONICK_DEMO_COOKIE_SEGURO:false}
autonick.auth.cadastro-aberto=${AUTONICK_DEMO_CADASTRO_ABERTO:false}

# Camada de dados (catálogo por domínio). Limites por identidade a cada minuto: 0 = sem limite.
autonick.dados.demonstracao-publica=${AUTONICK_DEMO_PUBLICA:false}
autonick.dados.escritas-por-minuto=${AUTONICK_LIMITE_ESCRITAS:0}
autonick.dados.leituras-por-minuto=${AUTONICK_LIMITE_LEITURAS:0}
autonick.dados.tempo-maximo-comando=15s

# Entrega da PWA pela API (vazio = não entrega) e modo exibido para a PWA.
autonick.pwa.pasta=${AUTONICK_PWA_PASTA:}
autonick.pwa.backend=${AUTONICK_PWA_BACKEND:java-local}
autonick.banco.permitir-remoto=${AUTONICK_BANCO_PERMITIR_REMOTO:false}

server.mime-mappings.webmanifest=application/manifest+json
server.mime-mappings.glb=model/gltf-binary
server.mime-mappings.mjs=text/javascript
server.mime-mappings.woff2=font/woff2
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
spring.datasource.hikari.maximum-pool-size=${AUTONICK_DB_POOL:10}
autonick.demo.montar-cenario=${AUTONICK_DEMO_MONTAR_CENARIO:false}
# Demonstração pública: funções que dependem da fila da CK (sem CK pública) ficam recusadas.
autonick.dados.bloqueadas-na-publica=denunciar,contestar_moderacao,abrir_contestacao
autonick.demo.validade-cenario=${AUTONICK_DEMO_VALIDADE:24h}
autonick.demo.cenarios-por-origem-dia=${AUTONICK_DEMO_POR_ORIGEM:3}
autonick.demo.cenarios-ativos-maximo=${AUTONICK_DEMO_ATIVOS:150}
# Demonstração pública: origens (esquema + host) aceitas nos pedidos de entrada, além da própria API (vírgulas).
autonick.auth.origens-permitidas=${AUTONICK_DEMO_ORIGENS:}
