# CI do AutoniCK: testes unitários, de banco e de navegador da PWA, e build e testes da API Java.
# Só verifica o código: não faz deploy e não usa segredos nem serviços de nuvem.
# Runner fixo em ubuntu-24.04: o Playwright 1.56.1 do projeto não instala o Chromium no ubuntu-26.04 (ubuntu-latest).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    # A instalação do Chromium e a suíte de interface levam perto de 19 minutos no runner padrão.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # PostgreSQL 18 (mesma versão usada pelo app) do repositório oficial PGDG. Os testes de banco criam um
      # cluster temporário e descartável por arquivo a partir desses binários (db/tests/ambiente.mjs); nunca o Neon.
      - name: PostgreSQL 18 (binários para os testes de banco)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-client-18
      - run: npm run test:unit
      - run: npm run test:db
        env:
          PG_BIN: /usr/lib/postgresql/18/bin
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Banco descartável do CI para os testes da API Java; nunca aponta para o Neon.
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # API (Spring Boot): compila, roda os testes (cada classe cria um banco próprio no PostgreSQL do serviço) e empacota.
      - name: API Java (build e testes)
        working-directory: java/os-api
        run: ./mvnw -B verify
        env:
          AUTONICK_JAVA_DB_URL: jdbc:postgresql://localhost:5432/postgres
          AUTONICK_JAVA_DB_USUARIO: postgres
      # Inicializador da demonstração local (PostgreSQL portátil): só compila.
      - name: Inicializador local (compilação)
        working-directory: java/demo-pwa-local
        run: ./mvnw -B -q compile
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-java
          path: java/os-api/target/surefire-reports/
          retention-days: 7
